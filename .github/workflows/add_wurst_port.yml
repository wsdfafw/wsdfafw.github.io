# Adds the necessary Jekyll metadata when an existing Wurst Client update is ported to a new Minecraft version.
name: Add Wurst Port
run-name: Add Wurst ${{ inputs.wurst_version }} build for ${{ inputs.mc_version }}

on:
  workflow_dispatch:
    inputs:
      wurst_version:
        description: "Wurst 版本（不带 v 或 -MC）"
        required: true
      mc_version:
        description: "Minecraft 版本"
        required: true
      fapi_version:
        description: "Fabric API 版本"
        required: true
      distinct_id:
        required: false

jobs:
  update_post:
    runs-on: ubuntu-latest
    steps:

    - name: Echo distinct ID ${{ inputs.distinct_id }}
      run: echo ${{ inputs.distinct_id }}

    - name: 检出仓库
      uses: actions/checkout@v6
      with:
        # So that the jekyll workflow runs automatically.
        token: ${{ secrets.WURSTCLIENT_NET_PUBLISH_TOKEN }}

    - name: 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: _scripts/requirements.txt

    - name: 安装依赖
      run: pip install -r _scripts/requirements.txt

    - name: 运行 add_wurst_port.py
      run: |
        python _scripts/add_wurst_port.py \
          "${{ inputs.wurst_version }}" \
          "${{ inputs.mc_version }}" \
          "${{ inputs.fapi_version }}"

    - name: 提交更改
      run: |
        WURST_VERSION=${{ inputs.wurst_version }}
        MC_VERSION=${{ inputs.mc_version }}
        git config --local user.email "contact.wurstimperium@gmail.com"
        git config --local user.name "Wurst-Bot"
        git add .
        git commit -m "[Wurst-Bot] 移植 Wurst $WURST_VERSION 到 Minecraft $MC_VERSION"
        git push
